# Gradle JVM: 1.20.1 Forge 需要 JDK 17 运行 ForgeGradle 与编译。
# 本机装了多个 JDK 时，取消下一行注释并指向你的 JDK 17：
# org.gradle.java.home=D:/path/to/jdk-17
org.gradle.jvmargs=-Xmx3G -Dnet.minecraftforge.gradle.check.certs=false
org.gradle.daemon=true
org.gradle.parallel=true

# Environment
minecraft_version=1.20.1
forge_version=47.4.10

# Mod
mod_id=metropolis
mod_name=Metropolis
mod_version=0.7.1-beta-forge
mod_group_id=team.dovecotmc.metropolis
mod_authors=Arrokoth233, Radekemia, HQIDK, ShirahaneExpress, Yomi_307, Dusbrio, opera7133, RAO_dIE
mod_description=Chemin de Fer Metropolitain - Minecraft Transit Railway addon (Forge 1.20.1 port)
archives_base_name=Metropolis-forge-1.20.1
